[package]
name = "mg-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "MultiGateway"
path = "src/main.rs"

[dependencies]
mg-core.workspace = true
mg-protocols.workspace = true
mg-providers.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
base64.workspace = true
futures.workspace = true
tokio-stream.workspace = true
bytes.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
uuid.workspace = true
chrono.workspace = true
wry = "0.57.0"
tao = "0.37.1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_Security"] }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
async-trait.workspace = true
