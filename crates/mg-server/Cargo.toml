[package]
name = "mg-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "MultiGateway"
path = "src/main.rs"

[dependencies]
mg-core.workspace = true
mg-protocols.workspace = true
mg-providers.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
sha2.workspace = true
mime_guess.workspace = true
base64.workspace = true
futures.workspace = true
tokio-stream.workspace = true
bytes.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
uuid.workspace = true
chrono.workspace = true
tauri = { version = "2.12.5", default-features = false, features = ["wry", "common-controls-v6", "custom-protocol", "compression"] }
open = "5"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tauri = { version = "2.12.5", default-features = false, features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_Security"] }

[build-dependencies]
tauri-build = { version = "2.7.4", default-features = false, features = ["config-json"] }

[dev-dependencies]
async-trait.workspace = true
