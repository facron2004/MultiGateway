[workspace]
members = [
    "crates/mg-core",
    "crates/mg-protocols",
    "crates/mg-providers",
    "crates/mg-server",
]
resolver = "2"

[workspace.package]
version = "0.11.3"
edition = "2021"
authors = ["MultiGateway Authors"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros", "ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "compression-gzip"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
bytes = "1.6"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
parking_lot = "0.12"
async-trait = "0.1"
mime_guess = "2.0"
base64 = "0.22"
dotenvy = "0.15"
url = "2.5"
eventsource-stream = "0.2"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
aes = "0.8"
md-5 = "0.10"
rsa = { version = "0.9", features = ["pem"] }

# Internal crates
mg-core = { path = "crates/mg-core" }
mg-protocols = { path = "crates/mg-protocols" }
mg-providers = { path = "crates/mg-providers" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
